name: Publiceer de PWA
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [Dagelijkse woningupdate]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    if: vars.ENABLE_PAGES == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - name: Bereid publieke bestanden voor
        run: |
          mkdir -p _site
          cp index.html app.js style.css manifest.webmanifest sw.js _site/
          cp -r assets data _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
